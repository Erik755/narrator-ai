name: Fetch Egunatek Voice

on:
  push:
    paths:
      - '.github/workflows/fetch-egunatek-voice.yml'

jobs:
  fetch_voice:
    runs-on: ubuntu-latest
    steps:
      - name: Download HeyGen neural narration
        run: |
          curl -L --fail --retry 3 'https://resource2.heygen.ai/text_to_speech/574c1fee481f4995837f1651e8d72ccf/2e42b8fee8f640e59893e2d22fbc3537/id=706451ed-0ca4-4f5d-967e-3e5f16b80e3a.wav' -o egunatek_heygen_natural.wav
          test -s egunatek_heygen_natural.wav
      - name: Upload narration artifact
        uses: actions/upload-artifact@v4
        with:
          name: egunatek-heygen-natural
          path: egunatek_heygen_natural.wav
          if-no-files-found: error
          retention-days: 1
