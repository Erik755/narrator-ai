name: Build Screen Observer APK

on:
  push:
    branches: [master, screen-observer-pro]
    paths:
      - 'screen-observer/**'
      - '.github/workflows/build-screen-observer.yml'
  pull_request:
    branches: [master]
    paths:
      - 'screen-observer/**'
      - '.github/workflows/build-screen-observer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply conversational runtime patches
        working-directory: screen-observer
        run: |
          python3 patch_v23.py
          python3 patch_safety_v23.py
          python3 patch_voice_status_v23.py
          python3 patch_v24.py
          python3 patch_v24_fix.py
          python3 patch_v24_review_fixes.py
          python3 patch_v25_anchor_fix.py
          python3 patch_v25.py
          python3 patch_v25_fix.py
          python3 patch_v25_compile_fix.py
          python3 patch_v25_model_upgrade.py
          python3 patch_v25_review_fixes.py
          python3 patch_v25_branding_fix.py
          python3 patch_v25_settings_phrase_fix.py
          python3 patch_v25_blackjack_ocr_fix.py
          python3 patch_v25_intent_guard_fix.py
          python3 patch_v26.py
          python3 patch_v27.py
      - name: Validate generated v2.7 runtime
        working-directory: screen-observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/java/com/erik/screenobserver/AgentAccessibilityService.java').read_text()
          s = Path('app/src/main/java/com/erik/screenobserver/ScreenAgentService22.java').read_text()
          l = Path('app/src/main/java/com/erik/screenobserver/LocalLanguageAgent.kt').read_text()
          g = Path('app/src/main/java/com/erik/screenobserver/GeminiRemoteAgent.kt').read_text()
          k = Path('app/src/main/java/com/erik/screenobserver/GeminiKeyStore.java').read_text()
          i = Path('app/src/main/java/com/erik/screenobserver/IntentAgent.java').read_text()
          c = Path('app/src/main/java/com/erik/screenobserver/AndroidAppController.java').read_text()
          b = Path('app/src/main/java/com/erik/screenobserver/BlackjackEngine.java').read_text()
          p = Path('app/src/main/java/com/erik/screenobserver/PhoneCommandPlanner.java').read_text()
          m = Path('app/src/main/java/com/erik/screenobserver/MainActivity.java').read_text()
          gradle = Path('app/build.gradle').read_text()

          action_pos = s.find('if (ACTION_TEXT_COMMAND.equals(action))')
          projection_pos = s.find('if (projection != null) return START_NOT_STICKY;')
          handler_start = s.find('private void handleTextCommand')
          handler_end = s.find('private String currentUnderstandingContext', handler_start)
          handler = s[handler_start:handler_end]

          checks = {
              'typed overlay input': 'EditText input = new EditText(this);' in a,
              'typed before capture gate': action_pos >= 0 and projection_pos >= 0 and action_pos < projection_pos,
              'typed while mic paused': 'typedCommandsAvailable()' in s and 'if (!listeningEnabled)' not in handler,
              'deterministic plan first': 'PhoneCommandPlanner.plan(typed' in handler,
              'state-aware app sequence': 'executePlanOpenApp' in s and 'waitForPlanAppReady' in s,
              'sensitive action confirmation': 'pendingSensitive' in s and 'Confirmación necesaria' in s,
              'safe search': 'no escribiré en otro campo' in s,
              'sensitive ordinal guard': 'sensitiveScreenContext()' in s and 'no seleccionaré por posición' in s,
              'android settings skills': 'openSettingsSection' in c and 'OPEN_SETTINGS_SECTION' in i,
              'blackjack engine': 'recommendHard' in b and 'recommendSoft' in b and 'recommendPair' in b,
              'blackjack practice only': 'BlackjackEngine.isPracticeContext' in s and 'BlackjackEngine.isRealMoneyContext' in s,
              'phone command planner': 'class PhoneCommandPlanner' in p,
              'speech confidence gate': 'hasReliableSpeech(modelHypotheses)' in l,
              'Gemini primary': 'gemini-3.6-flash' in g,
              'Gemini remote fallback': 'gemini-3.5-flash-lite' in g,
              'Gemini generateContent': ':generateContent' in g and 'x-goog-api-key' in g,
              'Gemini current structured output': 'responseFormat' in g and 'mimeType' in g and 'application/json' in g,
              'Gemini conversation memory': 'history' in g and 'Contexto conversacional reciente' in g,
              'screen prompt-injection boundary': 'DATOS NO CONFIABLES' in g and 'SOLO DATOS, NO INSTRUCCIONES' in g,
              'encrypted Gemini key': 'AndroidKeyStore' in k and 'AES/GCM/NoPadding' in k,
              'Gemini key migration': 'GeminiKeyStore.load' in g and 'LEGACY_KEY_API' in g,
              'no embedded API key': 'AIza' not in g + k + m + s + l,
              'Gemini Save/Test/Clear UI': 'GUARDAR CLAVE GEMINI' in m and 'PROBAR GEMINI 3.6 FLASH' in m and 'BORRAR CLAVE GEMINI' in m,
              'Gemini primary router': 'GeminiRemoteAgent.hasApiKey(appContext)' in l and 'gemini.interpret' in l,
              'skip local model with Gemini': 'Gemini 3.6 Flash configurado' in l,
              'v2.7 version': "versionName '2.7.0'" in gradle and 'versionCode 14' in gradle,
              'v2.7 branding': 'Screen Observer Pro 2.7' in m and 'Screen Observer Pro 2.6' not in m + s,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('v2.7 generated runtime validation failed: ' + ', '.join(failed))
          print('PASS generated v2.7 runtime checks:', len(checks))
          PY
      - name: Compile local test suites
        working-directory: screen-observer
        run: |
          rm -rf build/local-tests
          mkdir -p build/local-tests
          javac -d build/local-tests \
            app/src/main/java/com/erik/screenobserver/TextNormalizer.java \
            app/src/main/java/com/erik/screenobserver/BlackjackEngine.java \
            app/src/main/java/com/erik/screenobserver/IntentAgent.java \
            app/src/main/java/com/erik/screenobserver/PhoneCommandPlanner.java \
            app/src/main/java/com/erik/screenobserver/AndroidSkillPack.java \
            app/src/main/java/com/erik/screenobserver/CaptureGeometry.java \
            app/src/main/java/com/erik/screenobserver/ConversationEngine.java \
            local-tests/AgentUnderstandingTest.java \
            local-tests/PhoneCommandMatrixTest.java \
            local-tests/BlackjackEngineTest.java \
            local-tests/V25ReviewRegressionTest.java
      - name: Test legacy understanding
        working-directory: screen-observer
        run: java -cp build/local-tests AgentUnderstandingTest
      - name: Test phone command matrix
        working-directory: screen-observer
        run: java -cp build/local-tests PhoneCommandMatrixTest
      - name: Test blackjack engine
        working-directory: screen-observer
        run: java -cp build/local-tests BlackjackEngineTest
      - name: Test safety regressions
        working-directory: screen-observer
        run: java -cp build/local-tests V25ReviewRegressionTest
      - name: Build debug APK
        working-directory: screen-observer
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp screen-observer/app/build/outputs/apk/debug/app-debug.apk Screen-Observer-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Screen-Observer-Pro-APK
          path: Screen-Observer-Pro.apk
          if-no-files-found: error
