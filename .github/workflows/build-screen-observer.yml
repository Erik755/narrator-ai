name: Build Screen Observer APK

on:
  push:
    branches: [master, screen-observer-pro]
    paths:
      - 'screen-observer/**'
      - '.github/workflows/build-screen-observer.yml'
  pull_request:
    branches: [master]
    paths:
      - 'screen-observer/**'
      - '.github/workflows/build-screen-observer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply conversational runtime patches
        working-directory: screen-observer
        run: |
          python3 patch_v23.py
          python3 patch_safety_v23.py
          python3 patch_voice_status_v23.py
          python3 patch_v24.py
          python3 patch_v24_fix.py
          python3 patch_v24_review_fixes.py
          python3 patch_v25_anchor_fix.py
          python3 patch_v25.py
          python3 patch_v25_fix.py
          python3 patch_v25_compile_fix.py
      - name: Validate generated v2.5 runtime
        working-directory: screen-observer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a = Path('app/src/main/java/com/erik/screenobserver/AgentAccessibilityService.java').read_text()
          s = Path('app/src/main/java/com/erik/screenobserver/ScreenAgentService22.java').read_text()
          l = Path('app/src/main/java/com/erik/screenobserver/LocalLanguageAgent.kt').read_text()
          i = Path('app/src/main/java/com/erik/screenobserver/IntentAgent.java').read_text()
          c = Path('app/src/main/java/com/erik/screenobserver/AndroidAppController.java').read_text()
          b = Path('app/src/main/java/com/erik/screenobserver/BlackjackEngine.java').read_text()
          p = Path('app/src/main/java/com/erik/screenobserver/PhoneCommandPlanner.java').read_text()

          action_pos = s.find('if (ACTION_TEXT_COMMAND.equals(action))')
          projection_pos = s.find('if (projection != null) return START_NOT_STICKY;')
          handler_start = s.find('private void handleTextCommand')
          handler_end = s.find('private String currentUnderstandingContext', handler_start)
          handler = s[handler_start:handler_end]

          checks = {
              'typed overlay input': 'EditText input = new EditText(this);' in a,
              'typed action precedes projection gate': action_pos >= 0 and projection_pos >= 0 and action_pos < projection_pos,
              'typed channel independent of mic pause': 'typedCommandsAvailable()' in s and 'return runningState;' in s and 'if (!listeningEnabled)' not in handler,
              'deterministic plan first': 'PhoneCommandPlanner.plan(typed' in handler,
              'multi-step typed commands': 'executeCommandPlan' in s,
              'pause explains text remains active': 'La entrada escrita sigue activa' in s,
              'resume listening': 'case RESUME_LISTENING:' in s,
              'search skill': 'case SEARCH:' in s and 'searchCurrentApp' in s,
              'volume skills': 'case VOLUME_UP:' in s and 'adjustVolume' in s,
              'swipe skills': 'swipeLeft()' in a and 'swipeRight()' in a,
              'ordinal controls': 'clickOrdinal' in a and 'case CLICK_ORDINAL:' in s,
              'settings sections': 'openSettingsSection' in c and 'case OPEN_SETTINGS_SECTION:' in s,
              'notification settings action valid': 'Settings.ACTION_ALL_APPS_NOTIFICATION_SETTINGS' in c and 'Settings.ACTION_NOTIFICATION_SETTINGS' not in c,
              'url opening': 'openUrl' in c and 'case OPEN_URL:' in s,
              'blackjack engine': 'recommendHard' in b and 'recommendSoft' in b and 'recommendPair' in b,
              'blackjack advice': 'case BLACKJACK_ADVICE:' in s,
              'practice-only blackjack actuation': 'BlackjackEngine.isPracticeContext' in s and 'BlackjackEngine.isRealMoneyContext' in s,
              'phone command planner': 'class PhoneCommandPlanner' in p,
              'expanded parser': 'BLACKJACK_PLAY' in i and 'OPEN_SETTINGS_SECTION' in i and 'VOLUME_MUTE' in i,
              'model action safety': 'IntentAgent.Type.BLACKJACK_PLAY -> true' in l and 'hasReliableSpeech(hypotheses)' in l,
              'neutral typed/voice model input': 'Entrada del usuario:' in l,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('v2.5 generated runtime validation failed: ' + ', '.join(failed))
          print('PASS generated v2.5 runtime checks:', len(checks))
          PY
      - name: Test local intent and conversation fallback
        working-directory: screen-observer
        run: |
          rm -rf build/local-tests
          mkdir -p build/local-tests
          javac -d build/local-tests \
            app/src/main/java/com/erik/screenobserver/TextNormalizer.java \
            app/src/main/java/com/erik/screenobserver/BlackjackEngine.java \
            app/src/main/java/com/erik/screenobserver/IntentAgent.java \
            app/src/main/java/com/erik/screenobserver/PhoneCommandPlanner.java \
            app/src/main/java/com/erik/screenobserver/AndroidSkillPack.java \
            app/src/main/java/com/erik/screenobserver/CaptureGeometry.java \
            app/src/main/java/com/erik/screenobserver/ConversationEngine.java \
            local-tests/AgentUnderstandingTest.java \
            local-tests/PhoneCommandMatrixTest.java \
            local-tests/BlackjackEngineTest.java
          java -cp build/local-tests AgentUnderstandingTest
          java -cp build/local-tests PhoneCommandMatrixTest
          java -cp build/local-tests BlackjackEngineTest
      - name: Build debug APK
        working-directory: screen-observer
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp screen-observer/app/build/outputs/apk/debug/app-debug.apk Screen-Observer-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Screen-Observer-Pro-APK
          path: Screen-Observer-Pro.apk
          if-no-files-found: error
