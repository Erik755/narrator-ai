name: Build Screen Observer APK

on:
  push:
    branches: [master, screen-observer-pro]
    paths:
      - 'screen-observer/**'
      - '.github/workflows/build-screen-observer.yml'
  pull_request:
    branches: [master]
    paths:
      - 'screen-observer/**'
      - '.github/workflows/build-screen-observer.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply v2.3 conversational runtime patch
        working-directory: screen-observer
        run: |
          python3 patch_v23.py
          python3 patch_safety_v23.py
      - name: Test local intent and conversation fallback
        working-directory: screen-observer
        run: |
          mkdir -p build/local-tests
          javac -d build/local-tests \
            app/src/main/java/com/erik/screenobserver/TextNormalizer.java \
            app/src/main/java/com/erik/screenobserver/IntentAgent.java \
            app/src/main/java/com/erik/screenobserver/AndroidSkillPack.java \
            app/src/main/java/com/erik/screenobserver/CaptureGeometry.java \
            app/src/main/java/com/erik/screenobserver/ConversationEngine.java \
            local-tests/AgentUnderstandingTest.java
          java -cp build/local-tests AgentUnderstandingTest
      - name: Build debug APK
        working-directory: screen-observer
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: cp screen-observer/app/build/outputs/apk/debug/app-debug.apk Screen-Observer-Pro.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Screen-Observer-Pro-APK
          path: Screen-Observer-Pro.apk
          if-no-files-found: error
